name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + release APK (default configuration)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        # Local JVM tests (JUnit 4, no emulator): the autostart settings and
        # the logic behind the boot receiver. Runs before the APK is built so a
        # failing test fails the job early.
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test report
        # Only interesting when something broke; the HTML report says which
        # assertion failed.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble release
        # Uses the defaults from app/build.gradle.kts, i.e. the universal app
        # picker build. The release APK is signed with the auto generated debug
        # keystore, so no signing secrets are required.
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: UniversalLauncher-default-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
