# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build only the ABIs/configurations that are actually needed.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is mandatory for AGP 8.x.
android.useAndroidX=true

# Kotlin code style used by the IDE.
kotlin.code.style=official

# Only generate the resource classes for this module (faster builds).
android.nonTransitiveRClass=true
